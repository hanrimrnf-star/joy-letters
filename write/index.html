<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>새 서신 쓰기 · 부르심에 기쁨으로</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  body { background: #eaf3fb; }
  .ed-top { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 12px; padding: 12px 20px; background: rgba(255,255,255,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .ed-top img { height: 34px; }
  .ed-top h1 { font: 700 16px var(--title); margin: 0; color: var(--ink); }
  .ed-top .sp { flex: 1; }
  .ed-tabs { display: none; gap: 4px; background: var(--accent-soft); padding: 3px; border-radius: 99px; }
  .ed-tabs button { border: 0; background: none; font: 700 13px var(--sans); color: var(--ink-soft); padding: 6px 14px; border-radius: 99px; }
  .ed-tabs button.on { background: #fff; color: var(--accent); }
  .btn { font: 700 14px var(--sans); border: 0; border-radius: 12px; padding: 10px 16px; cursor: pointer; }
  .btn-primary { background: linear-gradient(135deg, #5db3ee, #2f86d4); color: #fff; }
  .btn-ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); }
  .btn-danger { background: none; color: #c0392b; padding: 6px 8px; font-size: 13px; }
  .btn:disabled { opacity: .5; cursor: default; }

  .ed-wrap { display: grid; grid-template-columns: minmax(360px, 520px) 1fr; gap: 28px; max-width: 1180px; margin: 0 auto; padding: 24px 20px 80px; }
  .ed-form { display: flex; flex-direction: column; gap: 16px; }
  .panel { background: #fff; border-radius: 18px; padding: 20px; box-shadow: var(--shadow); }
  .panel h2 { font: 700 15px var(--title); margin: 0 0 14px; color: var(--ink); display: flex; align-items: center; gap: 8px; }
  .panel h2 .chip { font: 700 11px var(--sans); color: var(--accent); background: var(--accent-soft); padding: 2px 8px; border-radius: 99px; }
  label.f { display: block; font-size: 13px; font-weight: 700; color: var(--ink-soft); margin: 12px 0 6px; }
  label.f:first-of-type { margin-top: 0; }
  label.f small { font-weight: 400; }
  .fi, textarea.fi { width: 100%; font: 400 15px/1.6 var(--sans); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: #fbfdff; }
  .fi:focus { outline: 2px solid #a9d3f6; border-color: var(--accent); }
  textarea.fi { min-height: 140px; resize: vertical; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .photos { display: flex; gap: 8px; flex-wrap: wrap; }
  .ph { position: relative; width: 92px; height: 92px; border-radius: 10px; overflow: hidden; background: #dcebf7 center / cover no-repeat; }
  .ph button { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border-radius: 50%; border: 0; background: rgba(0,0,0,.55); color: #fff; font-size: 13px; line-height: 22px; cursor: pointer; }
  .ph-add { width: 92px; height: 92px; border-radius: 10px; border: 1.5px dashed #9cc7ec; color: var(--accent); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; font-weight: 700; cursor: pointer; background: #f5faff; }
  .ph-add b { font-size: 22px; line-height: 1; }
  .ph-add input { display: none; }

  .card-ed { border: 1px solid var(--line); border-radius: 16px; padding: 16px; background: #fbfdff; }
  .card-ed + .card-ed { margin-top: 12px; }
  .card-ed-head { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
  .card-ed-head .no { font: 700 12px var(--title); color: var(--accent); background: var(--accent-soft); padding: 3px 10px; border-radius: 99px; }
  .card-ed-head .sp { flex: 1; }
  .icon-btn { border: 1px solid var(--line); background: #fff; width: 30px; height: 30px; border-radius: 8px; cursor: pointer; color: var(--ink-soft); }
  .add-card { width: 100%; margin-top: 12px; padding: 14px; border: 1.5px dashed #9cc7ec; background: #f5faff; color: var(--accent); }
  .hint { font-size: 12.5px; color: var(--ink-soft); margin: 8px 0 0; line-height: 1.6; }

  .publish { display: flex; flex-direction: column; gap: 10px; }
  .publish .btn-primary { padding: 15px; font-size: 16px; font-family: var(--title); }
  .status { font-size: 13.5px; color: var(--ink-soft); min-height: 1.2em; }
  .status.ok { color: #1f8a4c; font-weight: 700; }
  .status.err { color: #c0392b; }
  details.adv summary { cursor: pointer; font-size: 13px; color: var(--ink-soft); font-weight: 700; }

  .ed-preview { position: sticky; top: 76px; align-self: start; }
  .phone { width: 410px; max-width: 100%; margin: 0 auto; height: calc(100vh - 110px); border-radius: 34px; border: 10px solid #1d3247; background: var(--paper); overflow: hidden; box-shadow: 0 30px 60px -30px rgba(20,60,100,.5); }
  .phone-scroll { height: 100%; overflow-y: auto; background: var(--paper) linear-gradient(180deg, var(--top) 0, var(--paper) 420px) no-repeat; }
  .phone .masthead { padding: 18px 10px 14px; }
  .phone .brand-logo { width: 300px; }
  .phone .deck { padding: 0 14px 30px; gap: 22px; }
  .preview-label { text-align: center; font-size: 12px; color: var(--ink-soft); margin-bottom: 8px; font-weight: 700; letter-spacing: .08em; }
  .empty-card { text-align: center; color: var(--ink-soft); font-size: 14px; padding: 30px 10px; }

  @media (max-width: 900px) {
    .ed-tabs { display: flex; }
    .ed-wrap { grid-template-columns: 1fr; padding: 16px 12px 80px; }
    .ed-wrap[data-view="write"] .ed-preview { display: none; }
    .ed-wrap[data-view="preview"] .ed-form { display: none; }
    .ed-preview { position: static; }
    .phone { border: 0; border-radius: 0; height: auto; box-shadow: none; width: 100%; }
    .phone-scroll { height: auto; }
    .ed-top h1 { display: none; }
    .ed-top .btn-ghost { padding: 7px 10px; font-size: 12px; }
    .ed-top img { height: 28px; }
  }
  .themes { display: flex; gap: 8px; flex-wrap: wrap; }
  .theme-chip { display: flex; align-items: center; gap: 7px; font: 700 13px var(--sans); color: var(--ink); background: #fff; border: 1.5px solid var(--line); border-radius: 99px; padding: 6px 12px 6px 7px; cursor: pointer; }
  .theme-chip i { width: 20px; height: 20px; border-radius: 50%; display: block; box-shadow: inset 0 0 0 1px rgba(0,0,0,.06); }
  .theme-chip.on { border-color: var(--ink); box-shadow: 0 0 0 2px rgba(29,50,71,.12); }
  .edit-banner { display: flex; align-items: center; gap: 10px; background: #fff7e6; border: 1px solid #f3d9a4; color: #7a5300; border-radius: 14px; padding: 12px 14px; font-size: 14px; font-weight: 700; }
  .edit-banner span { flex: 1; }
  .edit-banner button { font: 700 12px var(--sans); background: #fff; border: 1px solid #f3d9a4; color: #7a5300; border-radius: 99px; padding: 6px 12px; cursor: pointer; }
  .mg { max-width: 760px; margin: 0 auto; padding: 24px 16px 80px; }
  .mg-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .mg-head h2 { font: 700 20px var(--title); margin: 0; flex: 1; color: var(--ink); }
  .mg-list { display: flex; flex-direction: column; gap: 10px; }
  .mg-item { display: flex; align-items: center; gap: 14px; background: #fff; border-radius: 16px; padding: 14px 16px; box-shadow: var(--shadow); }
  .mg-thumb { width: 64px; height: 64px; border-radius: 12px; flex: 0 0 auto; background: linear-gradient(135deg, #cfe7fa, #8fc5ef) center / cover no-repeat; }
  .mg-info { flex: 1; min-width: 0; }
  .mg-info b { display: block; font: 700 16px var(--title); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mg-info small { color: var(--ink-soft); font-size: 13px; }
  .mg-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .mg-actions a, .mg-actions button { font: 700 13px var(--sans); text-decoration: none; border-radius: 10px; padding: 8px 12px; cursor: pointer; border: 1px solid var(--line); background: #fff; color: var(--ink); }
  .mg-actions .edit { background: var(--accent-soft); border-color: var(--accent-soft); color: var(--accent); }
  .mg-actions .del { color: #c0392b; }
  .mg-actions .del.warn { background: #c0392b; color: #fff; border-color: #c0392b; }
  .mg-empty { text-align: center; color: var(--ink-soft); padding: 40px 10px; background: #fff; border-radius: 16px; }
  @media (max-width: 560px) { .mg-item { flex-wrap: wrap; } .mg-actions { width: 100%; justify-content: stretch; } .mg-actions > * { flex: 1; text-align: center; } }
</style>
</head>
<body>

<header class="ed-top">
  <img src="../assets/logo.png" alt="">
  <h1>새 서신 쓰기</h1>
  <span class="sp"></span>
  <div class="ed-tabs"><button data-v="write" class="on">작성</button><button data-v="preview">미리보기</button></div>
  <button class="btn btn-ghost" id="manageBtn" type="button">내 서신 관리</button>
  <button class="btn btn-ghost" id="resetBtn" type="button">새로 시작</button>
</header>

<section class="mg" id="manage" hidden>
  <div class="mg-head"><h2>내 서신 관리</h2><button class="btn btn-ghost" id="backBtn" type="button">← 글쓰기로</button></div>
  <div class="status" id="mgStatus"></div>
  <div class="mg-list" id="mgList"></div>
  <p class="hint">삭제해도 GitHub 기록에 남아 있어서, 필요하면 되살릴 수 있어요. 서신에 쓴 사진 파일은 지우지 않고 남겨 둡니다.</p>
</section>

<div class="ed-wrap" data-view="write">
  <div class="ed-form">
    <div class="edit-banner" id="editBanner" hidden><span id="editLabel"></span><button type="button" id="cancelEdit">수정 그만두기</button></div>

    <section class="panel">
      <h2>표지</h2>
      <label class="f">서신 제목</label>
      <input class="fi" id="title" placeholder="예) 다사다망(多事多忙)">
      <div class="row2">
        <div><label class="f">날짜</label><input class="fi" id="date" type="date"></div>
        <div><label class="f">호수 <small>(선택)</small></label><input class="fi" id="number" type="number" min="1" placeholder="예) 2"></div>
      </div>
      <label class="f">말씀 한 줄 <small>(선택)</small></label>
      <input class="fi" id="verse" placeholder="예) “너희는 기뻐하라” (빌 4:4)">
      <label class="f">목록에 보일 소개 <small>(선택 — 비우면 첫 카드 글로 자동)</small></label>
      <input class="fi" id="summary" placeholder="한두 줄 소개">
      <label class="f">바탕색</label>
      <div class="themes" id="themes"></div>
      <label class="f">표지 사진</label>
      <div class="photos" id="coverBox"></div>
    </section>

    <section class="panel">
      <h2>본문 카드 <span class="chip" id="cardCount">0장</span></h2>
      <div id="cards"></div>
      <button class="btn add-card" id="addCard" type="button">＋ 카드 추가</button>
      <p class="hint">카드 한 장 = 사진 0~2장 + 한 단락. 사진이 없으면 강조 카드로 보여요.<br>기도·후원 상자는 맨 아래에 자동으로 붙습니다.</p>
    </section>

    <section class="panel publish">
      <h2>게시하기</h2>
      <button class="btn btn-primary" id="publishBtn" type="button">서신 게시하기</button>
      <div class="status" id="status"></div>
      <details class="adv">
        <summary>설정 (처음 한 번만)</summary>
        <label class="f">GitHub 접근 키 <small>(이 기기에만 저장돼요)</small></label>
        <input class="fi" id="token" type="password" placeholder="github_pat_로 시작하는 키" autocomplete="off">
        <label class="f">주소 이름 <small>(영문·숫자 — 비우면 자동)</small></label>
        <input class="fi" id="slug" placeholder="예) winter-2026">
        <button class="btn btn-ghost" id="downloadBtn" type="button" style="margin-top:12px">글 파일(.md)만 내려받기</button>
      </details>
    </section>

  </div>

  <aside class="ed-preview">
    <div class="preview-label">미리보기 · 실제 화면과 같아요</div>
    <div class="phone"><div class="phone-scroll" id="preview"></div></div>
  </aside>
</div>

<div class="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  var OWNER = 'hanrimrnf-star', REPO = 'joy-letters', BRANCH = 'main';
  var THEMES = [['sky', '하늘', '#d9eefd', '#2f86d4'], ['spring', '봄빛 연두', '#d9efcb', '#4a9636'], ['sunset', '노을', '#fde3bf', '#e07b1e'], ['lavender', '라벤더', '#e4dbfa', '#7556c4'], ['snow', '겨울 눈꽃', '#dfe5ed', '#47698c']];
  var DRAFT_KEY = 'joyLetterDraft', TOKEN_KEY = 'joyLetterToken';
  var $ = function (s) { return document.querySelector(s); };

  /* ---------- 상태 ---------- */
  var state = { title: '', date: today(), number: '', verse: '', summary: '', cover: null, cards: [newCard()] };
  function srcOf(p) { return p.indexOf('data:') === 0 ? p : (p.charAt(0) === '/' ? '..' + p : '../images/' + p); }
  function today() { var d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }
  function newCard() { return { heading: '', text: '', photos: [] }; }

  try { var saved = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); if (saved && saved.cards) state = saved; } catch (e) {}
  try { $('#token').value = localStorage.getItem(TOKEN_KEY) || ''; } catch (e) {}

  var saveTimer;
  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      try { localStorage.setItem(DRAFT_KEY, JSON.stringify(state)); }
      catch (e) { /* 사진이 많으면 저장 공간 초과 — 글만 저장 */
        try { var lite = JSON.parse(JSON.stringify(state)); lite.cover = null; lite.cards.forEach(function (c) { c.photos = []; }); localStorage.setItem(DRAFT_KEY, JSON.stringify(lite)); } catch (e2) {}
      }
    }, 400);
  }

  /* ---------- 사진 줄이기 ---------- */
  function isHeic(f) { return /heic|heif/i.test(f.type) || /\.(heic|heif)$/i.test(f.name || ''); }
  var heicLib = null;
  function loadHeic() {
    if (window.heic2any) return Promise.resolve(window.heic2any);
    if (heicLib) return heicLib;
    heicLib = new Promise(function (ok, no) {
      var sc = document.createElement('script'); sc.src = 'heic2any.min.js';
      sc.onload = function () { ok(window.heic2any); }; sc.onerror = function () { heicLib = null; no(new Error('load')); };
      document.head.appendChild(sc);
    });
    return heicLib;
  }
  var busy = 0, noteAfter = '';
  function working(d) { busy += d; if (busy > 0) toast('사진 준비 중… (' + busy + '장)'); }
  function drawToJpeg(blob, cb, fail) {
    var img = new Image(), url = URL.createObjectURL(blob);
    img.onload = function () {
      var max = 1600, w = img.naturalWidth, h = img.naturalHeight, r = Math.min(1, max / Math.max(w, h));
      var c = document.createElement('canvas'); c.width = Math.round(w * r); c.height = Math.round(h * r);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); cb(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = function () { URL.revokeObjectURL(url); fail(); };
    img.src = url;
  }
  function shrink(file, cb) {
    working(1);
    var done = function (d) { working(-1); if (!busy) { toast(noteAfter || '사진을 넣었어요'); noteAfter = ''; } cb(d); };
    var fail = function (msg) { working(-1); toast(msg || '사진을 읽지 못했어요. 다른 사진으로 다시 시도해 주세요.'); };
    drawToJpeg(file, done, function () {
      if (!isHeic(file)) { fail(); return; }
      /* 아이폰 사진(HEIC)은 브라우저가 못 읽는 경우가 많아 JPG로 바꿔서 넣음 */
      toast('아이폰 사진을 변환하는 중… 잠시만요');
      loadHeic().then(function (h) { return h({ blob: file, toType: 'image/jpeg', quality: 0.9 }); })
        .then(function (out) { drawToJpeg(Array.isArray(out) ? out[0] : out, done, function () { fail(); }); })
        .catch(function () { fail('아이폰 사진(HEIC)을 변환하지 못했어요. 사진 앱에서 JPG로 내보낸 뒤 넣어 주세요.'); });
    });
  }

  /* ---------- 폼 그리기 ---------- */
  ['title', 'date', 'number', 'verse', 'summary'].forEach(function (k) {
    var el = $('#' + k); el.value = state[k] || '';
    el.addEventListener('input', function () { state[k] = el.value; save(); renderPreview(); });
  });

  function photoAdder(onAdd, multiple) {
    var lab = document.createElement('label'); lab.className = 'ph-add';
    lab.innerHTML = '<b>＋</b>사진';
    var inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*,.heic,.heif'; if (multiple) inp.multiple = true;
    inp.addEventListener('change', function () {
      var files = Array.prototype.slice.call(inp.files), room = lab._room ? lab._room() : files.length;
      if (files.length > room) { noteAfter = '카드 한 장에는 사진 2장까지예요. 앞의 ' + room + '장만 넣었어요.'; files = files.slice(0, room); }
      files.forEach(function (f) { shrink(f, onAdd); }); inp.value = '';
    });
    lab.appendChild(inp); return lab;
  }
  function thumb(src, onRemove) {
    var d = document.createElement('div'); d.className = 'ph'; d.style.backgroundImage = 'url(' + src + ')';
    var b = document.createElement('button'); b.type = 'button'; b.textContent = '×'; b.title = '사진 빼기'; b.onclick = onRemove;
    d.appendChild(b); return d;
  }

  function renderThemes() {
    var box = $('#themes'); box.innerHTML = '';
    THEMES.forEach(function (t) {
      var b = document.createElement('button'); b.type = 'button'; b.className = 'theme-chip' + ((state.theme || 'sky') === t[0] ? ' on' : '');
      b.innerHTML = '<i style="background:linear-gradient(135deg,' + t[2] + ' 50%,' + t[3] + ' 50%)"></i>' + t[1];
      b.onclick = function () { state.theme = t[0]; renderThemes(); changed(); };
      box.appendChild(b);
    });
  }
  function renderCover() {
    var box = $('#coverBox'); box.innerHTML = '';
    if (state.cover) box.appendChild(thumb(srcOf(state.cover), function () { state.cover = null; changed(); renderCover(); }));
    else box.appendChild(photoAdder(function (d) { state.cover = d; changed(); renderCover(); }));
  }

  function renderCards() {
    var wrap = $('#cards'); wrap.innerHTML = '';
    $('#cardCount').textContent = state.cards.length + '장';
    state.cards.forEach(function (c, i) {
      var el = document.createElement('div'); el.className = 'card-ed';
      el.innerHTML =
        '<div class="card-ed-head"><span class="no">' + pad(i + 1) + '</span><span class="sp"></span>' +
        '<button class="icon-btn" data-a="up" title="위로">↑</button><button class="icon-btn" data-a="down" title="아래로">↓</button>' +
        '<button class="btn btn-danger" data-a="del">삭제</button></div>' +
        '<div class="photos"></div>' +
        '<label class="f">소제목 <small>(선택)</small></label><input class="fi" data-k="heading" placeholder="예) 네 곳의 캠퍼스를 찾아가다">' +
        '<label class="f">글</label><textarea class="fi" data-k="text" placeholder="한 단락 정도의 글을 붙여넣으세요"></textarea>';
      var ph = el.querySelector('.photos');
      c.photos.forEach(function (p, j) { ph.appendChild(thumb(srcOf(p), function () { c.photos.splice(j, 1); changed(); renderCards(); })); });
      if (c.photos.length < 2) { var ad = photoAdder(function (d) { if (c.photos.length < 2) { c.photos.push(d); changed(); renderCards(); } }, true); ad._room = function () { return 2 - c.photos.length; }; ph.appendChild(ad); }
      el.querySelectorAll('[data-k]').forEach(function (f) {
        var k = f.getAttribute('data-k'); f.value = c[k] || '';
        f.addEventListener('input', function () { c[k] = f.value; save(); renderPreview(); });
      });
      el.querySelector('[data-a="up"]').onclick = function () { if (i > 0) { state.cards.splice(i - 1, 0, state.cards.splice(i, 1)[0]); changed(); renderCards(); } };
      el.querySelector('[data-a="down"]').onclick = function () { if (i < state.cards.length - 1) { state.cards.splice(i + 1, 0, state.cards.splice(i, 1)[0]); changed(); renderCards(); } };
      el.querySelector('[data-a="del"]').onclick = function () {
        if ((c.text || c.photos.length) && !el.dataset.confirm) { el.dataset.confirm = 1; this.textContent = '한 번 더 누르면 삭제'; return; }
        state.cards.splice(i, 1); if (!state.cards.length) state.cards.push(newCard()); changed(); renderCards();
      };
      wrap.appendChild(el);
    });
  }
  $('#addCard').onclick = function () { state.cards.push(newCard()); changed(); renderCards(); var all = document.querySelectorAll('.card-ed'); all[all.length - 1].scrollIntoView({ behavior: 'smooth', block: 'center' }); };

  function changed() { save(); renderPreview(); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function esc(s) { return String(s || '').replace(/[&<>"]/g, function (m) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]; }); }
  function paras(t) { return String(t || '').trim().split(/\n\s*\n/).filter(Boolean).map(function (p) { return '<p>' + esc(p).replace(/\n/g, '<br>') + '</p>'; }).join(''); }
  function fmtDate(s) { if (!s) return ''; var p = s.split('-'); return p[0] + '년 ' + (+p[1]) + '월 ' + (+p[2]) + '일'; }

  /* ---------- 미리보기 (실제 서신과 같은 구조) ---------- */
  var PRAYER = [
    ['건강을 위해 기도해주세요', '사역을 건강하게 잘 감당할 수 있도록'],
    ['재정을 위해 기도해주세요', '재정적인 어려움 없이 사역을 지속할 수 있도록'],
    ['지혜로운 사역자가 되도록 기도해주세요', '시대를 잘 파악하고 이 시대 청년대학생들을 지혜롭게 인도할 수 있도록'],
    ['가정을 위해 기도해주세요', '잦은 출장에도 하나님께서 자녀들과 아내, 가정에 평안함을 주시도록']
  ];
  function renderPreview() {
    var h = '<header class="masthead"><span class="brand"><img class="brand-logo" src="../assets/logo.png" alt=""><span class="brand-sub">최한림 간사의 사역서신</span></span></header><article class="deck">';
    h += '<header class="card card-cover in">' + (state.cover ? '<div class="cover-bg" style="background-image:url(' + srcOf(state.cover) + ')"></div>' : '') +
      '<div class="cover-inner"><p class="letter-meta">' + (state.number ? '<span class="letter-no">제' + esc(state.number) + '호</span>' : '') +
      '<time>' + fmtDate(state.date) + '</time></p><h1>' + (esc(state.title) || '<span style="opacity:.45">서신 제목</span>') + '</h1>' +
      (state.verse ? '<p class="letter-verse">' + esc(state.verse) + '</p>' : '') + '<p class="scroll-hint">아래로 넘겨 주세요 ↓</p></div></header>';
    var n = 0;
    state.cards.forEach(function (c) {
      if (!c.text && !c.heading && !c.photos.length) return;
      n++;
      var cls = 'card ' + (c.photos.length ? 'has-photo' : 'text-only') + (c.photos.length >= 2 ? ' two-photos' : '') + ' in';
      h += '<section class="' + cls + '"><span class="card-no">' + pad(n) + '</span>';
      if (c.photos.length) h += '<p>' + c.photos.map(function (p) { return '<img src="' + srcOf(p) + '" alt="">'; }).join('') + '</p>';
      if (c.heading) h += '<h2>' + esc(c.heading) + '</h2>';
      h += paras(c.text) + '</section>';
    });
    if (!n) h += '<section class="card text-only in"><p class="empty-card">왼쪽에서 카드를 채우면 여기에 나타나요</p></section>';
    h += '<footer class="card card-end in"><p class="end-sign">주 안에서, 최한림 간사 드림</p></footer>';
    h += '<section class="card card-prayer in"><h2>함께 기도해주세요</h2><ol>' + PRAYER.map(function (p) { return '<li><strong>' + p[0] + '</strong><span>' + p[1] + '</span></li>'; }).join('') + '</ol></section>';
    h += '<section class="card card-support in"><h2>후원을 요청합니다</h2><p>SFC 간사의 생활과 사역은 모두 후원으로 이루어집니다.</p><p>후원으로 SFC 사역에 동참해주시길 부탁드립니다.</p>' +
      '<div class="account"><div class="account-info"><span class="account-bank">농협</span><span class="account-no">302-0039-4850-21</span><span class="account-holder">예금주 최한림</span></div><span class="copy-account">계좌 복사</span></div>' +
      '<span class="cms-btn">정기후원(CMS) 신청하기 →</span></section>';
    h += '</article>';
    $('#preview').innerHTML = h;
    $('#preview').className = 'phone-scroll' + (state.theme && state.theme !== 'sky' ? ' theme-' + state.theme : '');
    $('#preview').querySelectorAll('.card img').forEach(function (img) { img.onload = function () { if (img.naturalHeight > img.naturalWidth) img.classList.add('portrait'); }; });
  }

  /* ---------- 글 파일 만들기 ---------- */
  function yq(s) { return '"' + String(s).replace(/\\/g, '\\\\').replace(/"/g, '\\"') + '"'; }
  function slugify() {
    var s = ($('#slug').value || '').trim().toLowerCase().replace(/[^a-z0-9-]+/g, '-').replace(/^-+|-+$/g, '');
    if (s) return s;
    if (state.number) return 'no' + state.number;
    var t = new Date(); return 'letter-' + pad(t.getHours()) + pad(t.getMinutes());
  }
  function build() {
    var slug, date, base, files = [], k = 0, stamp = '';
    if (state.edit) { var fn = state.edit.path.split('/').pop().replace(/\.md$/, ''); date = fn.slice(0, 10); slug = fn.slice(11); stamp = '-e' + Date.now().toString(36); }
    else { slug = slugify(); date = state.date || today(); }
    base = date + '-' + slug;
    var fm = ['---', 'layout: letter', 'title: ' + yq(state.title.trim())];
    if (state.number) fm.push('number: ' + parseInt(state.number, 10));
    if (state.verse.trim()) fm.push('verse: ' + yq(state.verse.trim()));
    if (state.summary.trim()) fm.push('summary: ' + yq(state.summary.trim()));
    if (state.theme && state.theme !== 'sky') fm.push('theme: ' + state.theme);
    if (state.cover) {
      if (state.cover.indexOf('data:') === 0) { var cn = base + stamp + '-cover.jpg'; files.push({ path: 'images/' + cn, data: state.cover }); fm.push('cover: "/images/' + cn + '"'); }
      else fm.push('cover: ' + yq(state.cover));
    }
    (state.extraFm || []).forEach(function (l) { fm.push(l); });
    fm.push('---', '');
    var blocks = state.cards.filter(function (c) { return c.text.trim() || c.heading.trim() || c.photos.length; }).map(function (c) {
      var b = [];
      if (c.photos.length) { b.push(c.photos.map(function (p) { if (p.indexOf('data:') !== 0) return '![](' + p + ')'; k++; var nm = base + stamp + '-' + k + '.jpg'; files.push({ path: 'images/' + nm, data: p }); return '![](' + nm + ')'; }).join('\n')); }
      if (c.heading.trim()) b.push('## ' + c.heading.trim());
      if (c.text.trim()) b.push(c.text.trim().replace(/\n\s*\n/g, '\n\n'));
      return b.join('\n\n');
    });
    var md = fm.join('\n') + '\n' + blocks.join('\n\n---\n\n') + '\n';
    return { md: md, mdPath: state.edit ? state.edit.path : '_posts/' + base + '.md', files: files, url: postUrl(date, slug) };
  }
  function check() {
    if (!state.title.trim()) return '서신 제목을 써 주세요.';
    if (!state.cards.some(function (c) { return c.text.trim() || c.photos.length; })) return '카드를 한 장 이상 채워 주세요.';
    return '';
  }

  /* ---------- GitHub에 올리기 ---------- */
  function b64utf8(s) { return btoa(unescape(encodeURIComponent(s))); }
  function api(path, opts, token) {
    return fetch('https://api.github.com/repos/' + OWNER + '/' + REPO + path, Object.assign({ headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json' } }, opts || {}))
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) { var e = new Error(j.message || r.status); e.status = r.status; throw e; } return j; }); });
  }
  function put(path, b64, msg, token, sha) {
    var body = { message: msg, content: b64, branch: BRANCH }; if (sha) body.sha = sha;
    return api('/contents/' + encodeURI(path), { method: 'PUT', body: JSON.stringify(body) }, token);
  }
  function status(t, cls) { var s = $('#status'); s.textContent = t; s.className = 'status' + (cls ? ' ' + cls : ''); }

  $('#publishBtn').onclick = function () {
    var err = check(); if (err) { status(err, 'err'); return; }
    var token = $('#token').value.trim();
    if (!token) { status('처음 한 번은 아래 ‘설정’에 GitHub 접근 키를 넣어 주세요.', 'err'); document.querySelector('details.adv').open = true; return; }
    try { localStorage.setItem(TOKEN_KEY, token); } catch (e) {}
    var out = build(), btn = this; btn.disabled = true;
    var total = out.files.length + 1, done = 0;
    var editing = state.edit;
    (editing ? api('/contents/' + encodeURI(out.mdPath), {}, token).then(function (j) { editing.sha = j.sha; })
      : api('/contents/' + encodeURI(out.mdPath), {}, token).then(function () { throw Object.assign(new Error('exists'), { exists: true }); }, function (e) { if (e.status !== 404) throw e; }))
      .then(function () {
        var chain = Promise.resolve();
        out.files.forEach(function (f) {
          chain = chain.then(function () { status('사진 올리는 중… (' + (++done) + '/' + total + ')'); return put(f.path, f.data.split(',')[1], '사진: ' + f.path, token); });
        });
        return chain.then(function () { status('서신 올리는 중… (' + total + '/' + total + ')'); return put(out.mdPath, b64utf8(out.md), (editing ? '서신 수정: ' : '새 서신: ') + state.title, token, editing && editing.sha); });
      })
      .then(function () {
        status(editing ? '수정했어요! 1~2분 뒤 사이트에 반영됩니다.' : '게시했어요! 1~2분 뒤 사이트에 나타납니다.', 'ok');
        if (editing) { state.edit = null; state.extraFm = null; showBanner(); }
        var a = document.createElement('a'); a.href = out.url; a.target = '_blank'; a.textContent = ' 서신 열기 →'; a.style.marginLeft = '6px'; $('#status').appendChild(a);
        try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
      })
      .catch(function (e) {
        if (e.exists) status('같은 날짜·주소의 서신이 이미 있어요. 설정에서 ‘주소 이름’을 다르게 써 주세요.', 'err');
        else if (e.status === 401) status('접근 키가 맞지 않아요. 설정에서 키를 다시 넣어 주세요.', 'err');
        else if (e.status === 403 || e.status === 404) status('이 키로는 joy-letters에 쓸 수 없어요. 키의 권한(Contents: Read and write)을 확인해 주세요.', 'err');
        else status('올리지 못했어요: ' + e.message, 'err');
      })
      .then(function () { btn.disabled = false; });
  };

  $('#downloadBtn').onclick = function () {
    var err = check(); if (err) { status(err, 'err'); return; }
    var out = build(), a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([out.md], { type: 'text/markdown' })); a.download = out.mdPath.split('/').pop(); a.click();
    status('글 파일을 내려받았어요. 사진은 따로 images 폴더에 올려야 해요.');
  };

  $('#resetBtn').onclick = function () {
    if (!this.dataset.c) { this.dataset.c = 1; this.textContent = '한 번 더 누르면 지워져요'; var b = this; setTimeout(function () { delete b.dataset.c; b.textContent = '새로 시작'; }, 3000); return; }
    state = { title: '', date: today(), number: '', verse: '', summary: '', cover: null, cards: [newCard()] };
    try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
    location.reload();
  };

  document.querySelectorAll('.ed-tabs button').forEach(function (b) {
    b.onclick = function () { document.querySelectorAll('.ed-tabs button').forEach(function (x) { x.classList.toggle('on', x === b); }); $('.ed-wrap').setAttribute('data-view', b.getAttribute('data-v')); window.scrollTo(0, 0); };
  });

  var toastEl = document.querySelector('.toast'), tt;
  function toast(m) { toastEl.textContent = m; toastEl.classList.add('show'); clearTimeout(tt); tt = setTimeout(function () { toastEl.classList.remove('show'); }, 2600); }

  /* ---------- 내 서신 관리 ---------- */
  function postUrl(date, slug) { return 'https://' + OWNER + '.github.io/' + REPO + '/letters/' + date.slice(0, 4) + '/' + date.slice(5, 7) + '/' + slug + '/'; }
  function unb64(c) { return decodeURIComponent(escape(atob(c.replace(/\n/g, '')))); }
  function unq(v) { v = v.trim(); if (/^".*"$/.test(v)) return v.slice(1, -1).replace(/\\"/g, '"').replace(/\\\\/g, '\\'); if (/^'.*'$/.test(v)) return v.slice(1, -1); return v; }
  function parseMd(md) {
    var m = md.replace(/\r/g, '').match(/^---\n([\s\S]*?)\n---\n?([\s\S]*)$/);
    var front = m ? m[1] : '', body = m ? m[2] : md, meta = {}, extra = [], lines = front.split('\n'), i = 0;
    while (i < lines.length) {
      var L = lines[i], mm = L.match(/^([A-Za-z_]+):\s*(.*)$/);
      if (mm && ['title', 'number', 'verse', 'summary', 'cover', 'layout', 'theme'].indexOf(mm[1]) >= 0) { meta[mm[1]] = unq(mm[2]); i++; continue; }
      extra.push(L); i++;   /* prayer:, sign: 등 그 밖의 줄은 그대로 보존 */
    }
    var cards = body.split(/\n-{3,}\s*\n/).map(function (chunk) {
      var c = newCard(), text = [];
      chunk.trim().split('\n').forEach(function (ln) {
        var im = ln.match(/^!\[[^\]]*\]\(([^)]+)\)\s*$/), hd = ln.match(/^##\s+(.*)$/);
        if (im) c.photos.push(im[1].trim()); else if (hd && !c.heading) c.heading = hd[1].trim(); else text.push(ln);
      });
      c.text = text.join('\n').trim(); return c;
    }).filter(function (c) { return c.text || c.heading || c.photos.length; });
    return { meta: meta, extra: extra.filter(function (l) { return l.trim() !== ''; }), cards: cards.length ? cards : [newCard()] };
  }
  function needToken(st) {
    var t = $('#token').value.trim() || (function () { try { return localStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return ''; } })();
    if (!t) { st('먼저 글쓰기 화면 아래 ‘설정’에 GitHub 접근 키를 넣어 주세요.', 'err'); }
    return t;
  }
  function mgStatus(t, cls) { var s = $('#mgStatus'); s.textContent = t; s.className = 'status' + (cls ? ' ' + cls : ''); }
  function showView(v) {
    $('#manage').hidden = v !== 'manage';
    $('.ed-wrap').style.display = v === 'manage' ? 'none' : '';
    document.querySelector('.ed-tabs').style.visibility = v === 'manage' ? 'hidden' : '';
    window.scrollTo(0, 0);
  }
  function showBanner() {
    var b = $('#editBanner');
    if (state.edit) { b.hidden = false; $('#editLabel').textContent = '「' + (state.title || '제목 없음') + '」 수정 중'; $('#publishBtn').textContent = '수정 내용 저장하기'; $('#date').disabled = true; }
    else { b.hidden = true; $('#publishBtn').textContent = '서신 게시하기'; $('#date').disabled = false; }
  }
  function loadList() {
    var token = needToken(mgStatus); if (!token) return;
    var list = $('#mgList'); list.innerHTML = ''; mgStatus('서신 목록을 불러오는 중…');
    api('/contents/_posts?ref=' + BRANCH, {}, token).then(function (files) {
      files = files.filter(function (f) { return /\.md$/.test(f.name); }).sort(function (a, b) { return a.name < b.name ? 1 : -1; });
      if (!files.length) { mgStatus(''); list.innerHTML = '<div class="mg-empty">아직 게시한 서신이 없어요.</div>'; return; }
      return Promise.all(files.map(function (f) { return api('/contents/' + encodeURI(f.path) + '?ref=' + BRANCH, {}, token); })).then(function (docs) {
        mgStatus('');
        docs.forEach(function (d) {
          var parsed = parseMd(unb64(d.content)), fn = d.name.replace(/\.md$/, ''), date = fn.slice(0, 10), slug = fn.slice(11);
          var thumbSrc = parsed.meta.cover || (parsed.cards.find(function (c) { return c.photos.length; }) || { photos: [] }).photos[0];
          var row = document.createElement('div'); row.className = 'mg-item';
          row.innerHTML = '<div class="mg-thumb"' + (thumbSrc ? ' style="background-image:url(' + srcOf(thumbSrc) + ')"' : '') + '></div>' +
            '<div class="mg-info"><b>' + esc(parsed.meta.title || fn) + '</b><small>' + fmtDate(date) + (parsed.meta.number ? ' · 제' + esc(parsed.meta.number) + '호' : '') + '</small></div>' +
            '<div class="mg-actions"><a href="' + postUrl(date, slug) + '" target="_blank" rel="noopener">보기</a><button class="edit" type="button">수정</button><button class="del" type="button">삭제</button></div>';
          row.querySelector('.edit').onclick = function () {
            state = { title: parsed.meta.title || '', date: date, number: parsed.meta.number || '', verse: parsed.meta.verse || '', summary: parsed.meta.summary || '',
              cover: parsed.meta.cover || null, theme: parsed.meta.theme || 'sky', cards: parsed.cards, extraFm: parsed.extra, edit: { path: d.path } };
            ['title', 'date', 'number', 'verse', 'summary'].forEach(function (k) { $('#' + k).value = state[k] || ''; });
            save(); renderThemes(); renderCover(); renderCards(); renderPreview(); showBanner(); status(''); showView('write');
          };
          var del = row.querySelector('.del');
          del.onclick = function () {
            if (!del.classList.contains('warn')) { del.classList.add('warn'); del.textContent = '정말 삭제'; setTimeout(function () { del.classList.remove('warn'); del.textContent = '삭제'; }, 4000); return; }
            del.disabled = true; mgStatus('삭제하는 중…');
            api('/contents/' + encodeURI(d.path), { method: 'DELETE', body: JSON.stringify({ message: '서신 삭제: ' + (parsed.meta.title || fn), sha: d.sha, branch: BRANCH }) }, token)
              .then(function () { row.remove(); mgStatus('삭제했어요. 1~2분 뒤 사이트에서 사라집니다.', 'ok'); if (state.edit && state.edit.path === d.path) { state.edit = null; showBanner(); } })
              .catch(function (e) { del.disabled = false; mgStatus('삭제하지 못했어요: ' + e.message, 'err'); });
          };
          list.appendChild(row);
        });
      });
    }).catch(function (e) { mgStatus(e.status === 401 ? '접근 키가 맞지 않아요. 설정에서 다시 넣어 주세요.' : '목록을 불러오지 못했어요: ' + e.message, 'err'); });
  }
  $('#manageBtn').onclick = function () { showView('manage'); loadList(); };
  $('#backBtn').onclick = function () { showView('write'); };
  $('#cancelEdit').onclick = function () {
    state = { title: '', date: today(), number: '', verse: '', summary: '', cover: null, cards: [newCard()] };
    ['title', 'date', 'number', 'verse', 'summary'].forEach(function (k) { $('#' + k).value = state[k] || ''; });
    save(); renderThemes(); renderCover(); renderCards(); renderPreview(); showBanner(); status('');
  };

  renderThemes(); renderCover(); renderCards(); renderPreview(); showBanner();
})();
</script>
</body>
</html>

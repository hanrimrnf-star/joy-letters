<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{% if page.summary %}{{ page.summary }}{% else %}{{ site.description }}{% endif %}">
  <meta property="og:title" content="{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}">
  <meta property="og:description" content="{% if page.summary %}{{ page.summary }}{% else %}{{ site.description }}{% endif %}">
  <meta property="og:type" content="{% if page.layout == 'letter' %}article{% else %}website{% endif %}">
  <meta property="og:image" content="{% if page.cover %}{{ page.cover | absolute_url }}{% else %}{{ '/assets/logo.png' | absolute_url }}{% endif %}">
  <link rel="preload" href="{{ '/assets/fonts/GmarketSansBold.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ '/assets/fonts/Paperlogy-4Regular.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body{% if page.theme and page.theme != 'sky' %} class="theme-{{ page.theme }}"{% endif %}>
  <header class="masthead">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img class="brand-logo" src="{{ '/assets/logo.png' | relative_url }}" alt="{{ site.title }} — 기쁨으로 여호와를 섬기며 노래하면서 그의 앞에 나아갈지어다 (시편 100편 2절)" width="1400" height="604">
      <span class="brand-sub">{{ site.subtitle }}</span>
    </a>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="colophon">
    <p class="colophon-name">{{ site.author }}</p>
    {% if site.ministry != "" %}<p>{{ site.ministry }}</p>{% endif %}
    {% if site.email != "" %}<p><a href="mailto:{{ site.email }}">{{ site.email }}</a></p>{% endif %}
  </footer>
{% if site.goatcounter != "" %}
<script>
  /* 관리 화면을 쓴 기기(간사님 기기)는 방문 수에서 빼기 */
  (function () {
    var me = false; try { me = localStorage.getItem('joyAdmin') === '1'; } catch (e) {}
    if (me) return;
    var s = document.createElement('script'); s.async = true; s.src = '//gc.zgo.at/count.js';
    s.setAttribute('data-goatcounter', 'https://{{ site.goatcounter }}.goatcounter.com/count');
    document.body.appendChild(s);
  })();
</script>
{% endif %}
</body>
</html>
